name: Release

# Publishes @iefnaf/shepherd (the connector CLI) to npm. Triggered by pushing a `v*` tag
# (e.g. `v0.1.0`) after bumping apps/connector/package.json; requires an NPM_TOKEN secret
# with publish rights for the @iefnaf scope. ADR-0001 decision 10, issue #26.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @iefnaf/shepherd build
      - run: pnpm --filter @iefnaf/shepherd typecheck
      - run: pnpm --filter @iefnaf/shepherd test
      # prepack rebuilds dist into the tarball; the manifest carries no runtime deps.
      - run: npm publish --access public
        working-directory: apps/connector
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
